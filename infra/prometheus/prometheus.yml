global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:8080"]

  - job_name: livekit
    static_configs:
      - targets: ["livekit:6789"]

  - job_name: coturn
    static_configs:
      - targets: ["coturn:9641"]
