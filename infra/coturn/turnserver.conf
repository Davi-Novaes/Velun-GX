# coturn — relay TURN para redes que bloqueiam UDP direto ao SFU.
# Segredo, IP externo, faixa de relay e IP do SFU (único destino privado permitido) vêm da linha de comando (docker-compose).

listening-port=3478
realm=screenshare
fingerprint

# Credenciais efêmeras (TURN REST API): usuário = "<expira>:<id>", senha = HMAC-SHA1(segredo, usuário).
# O LiveKit gera essas credenciais e as entrega ao navegador; não existe senha fixa no frontend.
use-auth-secret
stale-nonce=600

# Cada participante reserva até 4 alocações (publicação + assinatura × UDP e TCP), mesmo usando caminho direto.
# Alocação abandonada (navegador fechado sem encerrar) volta ao pool em até 5 min; clientes ativos renovam sozinhos.
max-allocate-lifetime=300

# Desenvolvimento: sem TLS. Produção adiciona TURN/TLS em 5349 (ou 443) com certificado.
pidfile="/var/tmp/turnserver.pid"
no-tls
no-multicast-peers

# Limites contra abuso
user-quota=12
total-quota=1200
# bytes/s por sessão (~24 Mbps, acima do preset 4K60)
max-bps=3000000

# O relay não pode ser usado para alcançar redes internas (allowed-peer-ip na linha de comando libera só o SFU).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

prometheus
log-file=stdout
simple-log
