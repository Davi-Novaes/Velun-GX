# Configuração estática do Traefik para servidor: só HTTPS (HTTP redireciona).
# Certificado: infra/certs (dynamic.yml). Com domínio, entra o Let's Encrypt (certificatesResolvers).
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}

providers:
  docker:
    exposedByDefault: false
    network: screenshare_app
  file:
    filename: /etc/traefik/dynamic.yml

ping: {}

api:
  dashboard: false

log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes: ["400-599"]
