server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # assets com hash no nome: cache longo e imutável
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # instalador e atualizações do app desktop Velun Gx (pasta do servidor montada só para leitura: infra/downloads)
    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        types { application/octet-stream exe blockmap; text/yaml yml; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # SPA: qualquer rota (/room/ABC123, /s/ABC123) devolve o index.html, que nunca é cacheado
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
